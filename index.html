<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f1ff" />
    <title>Inženýři · školní přehled</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ff;
        --surface: #ffffffcf;
        --solid: #fff;
        --text: #172033;
        --muted: #697386;
        --line: #5d539124;
        --violet: #7657e8;
        --violet-soft: #eee9ff;
        --blue: #3c82f6;
        --blue-soft: #e7f0ff;
        --green: #24855b;
        --green-soft: #e4f6ed;
        --coral: #ec6c68;
        --coral-soft: #fff0ed;
        --danger: #c64242;
        --shadow: 0 24px 70px #3f31751f;
        --card-shadow: 0 15px 40px #3f31751c;
      }
      body.dark {
        color-scheme: dark;
        --bg: #10121a;
        --surface: #1c1f2de8;
        --solid: #1c1f2d;
        --text: #f5f5fb;
        --muted: #a7adbf;
        --line: #d8d3ff1f;
        --violet: #a58cf4;
        --violet-soft: #30294b;
        --blue: #79aaff;
        --blue-soft: #1f304d;
        --green: #6fd3a3;
        --green-soft: #1d3c31;
        --coral: #ff918c;
        --coral-soft: #482c31;
        --danger: #ff918c;
        --shadow: 0 24px 70px #0005;
        --card-shadow: 0 15px 40px #0004;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 0%, #7657e82e, transparent 30rem),
          radial-gradient(circle at 92% 8%, #3c82f624, transparent 26rem),
          var(--bg);
        transition: 0.25s;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .auth-card {
        width: min(430px, 100%);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 30px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }
      .lock-icon {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin-bottom: 22px;
        border-radius: 18px;
        color: var(--violet);
        background: var(--violet-soft);
        font-size: 1.45rem;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--violet);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .auth-card h1 {
        margin: 0;
        font-size: 2.25rem;
        letter-spacing: -0.05em;
      }
      .auth-copy {
        margin: 12px 0 24px;
        color: var(--muted);
        line-height: 1.55;
      }
      .password-label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.86rem;
        font-weight: 750;
      }
      .password-row {
        display: flex;
        gap: 10px;
      }
      .password-row input {
        min-width: 0;
        flex: 1;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: var(--solid);
        outline: none;
      }
      .password-row input:focus {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px #7657e824;
      }
      .unlock-button {
        padding: 13px 18px;
        border: 0;
        border-radius: 14px;
        color: white;
        background: var(--violet);
        font-weight: 800;
      }
      .unlock-button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .auth-error {
        min-height: 1.35em;
        margin: 13px 0 0;
        color: var(--danger);
        font-size: 0.86rem;
        line-height: 1.45;
      }
      .security-note {
        margin: 19px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.5;
      }
      .page {
        width: min(1180px, calc(100% - 32px));
        margin: auto;
        padding: 50px 0 70px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 34px;
      }
      .topbar h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.6rem);
        line-height: 0.96;
        letter-spacing: -0.065em;
      }
      .lead {
        max-width: 600px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.65;
      }
      .top-actions {
        display: flex;
        gap: 10px;
      }
      .icon-button {
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--text);
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }
      .overview {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .category {
        --accent: var(--violet);
        --tint: var(--violet-soft);
        position: relative;
        overflow: hidden;
        width: 100%;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }
      .tests {
        --accent: var(--coral);
        --tint: var(--coral-soft);
      }
      .events {
        --accent: var(--blue);
        --tint: var(--blue-soft);
      }
      .completed {
        --accent: var(--green);
        --tint: var(--green-soft);
      }
      .category-head {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 20px;
      }
      .category-icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        color: var(--accent);
        background: var(--tint);
      }
      h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .count {
        min-width: 30px;
        padding: 5px 9px;
        border-radius: 99px;
        color: var(--accent);
        background: var(--tint);
        font-size: 0.8rem;
        font-weight: 800;
        text-align: center;
      }
      .carousel-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .carousel-position {
        min-width: 48px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 750;
        text-align: center;
      }
      .carousel-arrow {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--accent);
        background: var(--solid);
      }
      .carousel-arrow:disabled {
        opacity: 0.28;
        cursor: default;
      }
      .items {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        cursor: grab;
        touch-action: pan-x pan-y;
        padding: 5px 9% 16px 3px;
        overscroll-behavior-x: contain;
      }
      .items::-webkit-scrollbar {
        display: none;
      }
      .items.is-dragging {
        cursor: grabbing;
        scroll-snap-type: none;
        scroll-behavior: auto;
        user-select: none;
      }
      .items.is-refreshing,
      .items.is-refreshing .item {
        scroll-behavior: auto !important;
        transition: none !important;
      }
      .item {
        flex: 0 0 calc(100% - 9%);
        min-height: 190px;
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 19px;
        background: var(--solid);
        box-shadow: 0 8px 22px #3a2e6512;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      .item.is-done {
        opacity: 0.58;
      }
      .item.is-done .item-name {
        text-decoration: line-through;
      }
      .item-top {
        display: flex;
        align-items: flex-start;
        gap: 11px;
      }
      .check {
        width: 19px;
        height: 19px;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      .item-main {
        min-width: 0;
        flex: 1;
      }
      .item-name {
        margin: 0;
        font-size: 0.98rem;
        line-height: 1.35;
      }
      .date {
        display: block;
        margin-top: 7px;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 750;
      }
      .item-text {
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .item a {
        color: var(--accent);
        font-weight: 750;
        overflow-wrap: anywhere;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 0.16em;
      }
      .solution {
        margin-top: 12px;
        padding: 13px;
        border-radius: 13px;
        background: var(--tint);
        font-size: 0.86rem;
        line-height: 1.55;
      }
      .solution-toggle {
        margin-top: 13px;
        padding: 0;
        border: 0;
        color: var(--accent);
        background: none;
        font-size: 0.82rem;
        font-weight: 800;
      }
      .empty {
        flex: 1 0 100%;
        padding: 30px 16px;
        border: 1px dashed var(--line);
        border-radius: 18px;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }
      .category {
        overflow: visible;
        padding: 8px 0 20px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }
      .category-head {
        width: min(720px, 88%);
        margin: 0 auto 14px;
      }
      .items {
        padding: 12px max(6%, calc((100% - 720px) / 2)) 26px;
        -webkit-mask-image: linear-gradient(
          90deg,
          transparent 0,
          #000 7%,
          #000 93%,
          transparent 100%
        );
        mask-image: linear-gradient(
          90deg,
          transparent 0,
          #000 7%,
          #000 93%,
          transparent 100%
        );
      }
      .items.is-single {
        justify-content: center;
      }
      .item {
        flex-basis: min(720px, 88%);
        opacity: 0.42;
        filter: blur(1.6px);
        transform: scale(0.93);
        scroll-snap-align: center;
        transition:
          opacity 0.28s ease,
          filter 0.28s ease,
          transform 0.28s ease,
          box-shadow 0.28s ease;
      }
      .item.is-active {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
        box-shadow: 0 20px 45px #3a2e6526;
      }
      .item.is-completing {
        pointer-events: none;
      }
      .item.is-completing.is-last-completing {
        opacity: 0 !important;
        filter: blur(4px) !important;
        transform: scale(0.94) !important;
      }
      .item.is-done {
        opacity: 0.38;
      }
      .item.is-active.is-done {
        opacity: 0.62;
      }
      .carousel-arrow {
        font-size: 1.65rem;
        line-height: 1;
        transition:
          transform 0.18s,
          background 0.18s;
      }
      .carousel-arrow:hover:not(:disabled) {
        transform: scale(1.1);
        background: var(--tint);
      }
      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      @keyframes password-autofill {
        from {
          opacity: 0.999;
        }
        to {
          opacity: 1;
        }
      }
      input:-webkit-autofill {
        animation-name: password-autofill;
        animation-duration: 0.01s;
      }
      .site-footer {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 38px;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .site-footer span + span::before {
        content: "·";
        margin-right: 10px;
        color: var(--line);
      }
      .quiz-page {
        width: min(760px, calc(100% - 28px));
        margin: auto;
        padding: 38px 0 70px;
      }
      .quiz-back {
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--text);
        background: var(--surface);
      }
      .quiz-card {
        margin-top: 22px;
        padding: clamp(22px, 5vw, 42px);
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .quiz-progress {
        color: var(--violet);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .quiz-question {
        margin: 14px 0 24px;
        font-size: clamp(1.35rem, 4vw, 2rem);
        line-height: 1.25;
      }
      .quiz-options {
        display: grid;
        gap: 11px;
      }
      .quiz-option {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--solid);
        cursor: pointer;
      }
      .quiz-option:has(input:checked) {
        border-color: var(--violet);
        background: var(--violet-soft);
      }
      .quiz-text {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: var(--solid);
      }
      .quiz-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }
      .quiz-primary,
      .quiz-start {
        padding: 11px 16px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        background: var(--violet);
        font-weight: 800;
      }
      .quiz-start {
        margin-top: 14px;
      }
      .quiz-feedback {
        margin-top: 18px;
        padding: 13px;
        border-radius: 13px;
      }
      .quiz-feedback.correct {
        color: #14563d;
        background: #ccebdc;
      }
      .quiz-feedback.wrong {
        color: #842828;
        background: #f5cece;
      }
      body.dark .quiz-feedback.correct {
        color: #b8ead3;
        background: #173a30;
        border: 1px solid #2e6855;
      }
      body.dark .quiz-feedback.wrong {
        color: #ffc0c0;
        background: #442326;
        border: 1px solid #754047;
      }
      .quiz-score {
        text-align: center;
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 900;
        color: var(--violet);
      }
      @media (max-width: 590px) {
        .auth-card {
          padding: 25px;
        }
        .page {
          width: calc(100% - 22px);
          padding-top: 28px;
        }
        .topbar {
          align-items: flex-start;
        }
        .lead {
          font-size: 0.95rem;
        }
        .category {
          padding: 6px 0 16px;
        }
        .category-head {
          width: 88%;
          flex-wrap: wrap;
        }
        .carousel-controls {
          width: 100%;
          justify-content: flex-end;
        }
        .items {
          padding: 10px 6% 22px;
        }
        .item {
          flex-basis: 88%;
          min-height: 170px;
        }
      }
    </style>
  </head>
  <body>
    <section id="authView" class="auth-shell">
      <form id="unlockForm" class="auth-card" autocomplete="on">
        <div class="lock-icon" aria-hidden="true">●</div>
        <p class="eyebrow">Chráněný přehled</p>
        <h1>Inženýři</h1>
        <p class="auth-copy">
          Zadej heslo pro odemknutí obsahu. Dešifrování proběhne pouze v tomto
          prohlížeči.
        </p>
        <input
          class="sr-only"
          name="username"
          type="text"
          value="inzenyri"
          readonly
          autocomplete="username"
          tabindex="-1"
          aria-hidden="true"
        /><label class="password-label" for="password">Heslo</label>
        <div class="password-row">
          <input
            id="password"
            name="password"
            type="password"
            required
            autofocus
            autocomplete="current-password"
          /><button id="unlockButton" class="unlock-button" type="submit">
            Odemknout
          </button>
        </div>
        <p
          id="authError"
          class="auth-error"
          role="alert"
          aria-live="polite"
        ></p>
        <p class="security-note">Heslo se neukládá ani neposílá na server.</p>
      </form>
    </section>
    <main id="app" class="page" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Školní přehled</p>
          <h1>Inženýři</h1>
          <p class="lead">
            Všechno důležité na jednom místě — testy, úkoly a školní akce.
          </p>
        </div>
        <div class="top-actions">
          <button
            id="lockButton"
            class="icon-button"
            type="button"
            aria-label="Zamknout"
          >
            ●</button
          ><button
            id="darkModeToggle"
            class="icon-button"
            type="button"
            aria-label="Přepnout tmavý režim"
          >
            ☾
          </button>
        </div>
      </header>
      <section class="overview" aria-label="Přehled povinností">
        <section class="category tests">
          <header class="category-head">
            <span class="category-icon">✎</span>
            <h2>Testy</h2>
            <span id="testsCount" class="count">0</span>
          </header>
          <div id="testsList" class="items" aria-live="polite"></div>
        </section>
        <section class="category tasks">
          <header class="category-head">
            <span class="category-icon">✓</span>
            <h2>Úkoly</h2>
            <span id="tasksCount" class="count">0</span>
          </header>
          <div id="tasksList" class="items" aria-live="polite"></div>
        </section>
        <section class="category events">
          <header class="category-head">
            <span class="category-icon">◇</span>
            <h2>Akce</h2>
            <span id="eventsCount" class="count">0</span>
          </header>
          <div id="eventsList" class="items" aria-live="polite"></div>
        </section>
        <section class="category completed" hidden>
          <header class="category-head">
            <span class="category-icon">✓</span>
            <h2>Dokončené</h2>
            <span id="completedCount" class="count">0</span>
          </header>
          <div id="completedList" class="items" aria-live="polite"></div>
        </section>
      </section>
      <footer class="site-footer">
        <span id="pageVersion"></span><span id="dbVersion"></span>
      </footer>
    </main>
    <main id="quizView" class="quiz-page" hidden>
      <button id="quizBack" class="quiz-back" type="button">
        ← Zpět na přehled
      </button>
      <section id="quizContent" class="quiz-card" aria-live="polite"></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
