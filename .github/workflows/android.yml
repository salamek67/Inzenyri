name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: app
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
        run: gradle assembleDebug -PgithubAppClientId="$GH_APP_CLIENT_ID"
      - name: Prepare debug APK artifact
        working-directory: app
        run: |
          apk_path="$(find . -type f -path '*/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "::error::Gradle completed, but no debug APK was found. APK files under the project:"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          cp "$apk_path" "$RUNNER_TEMP/inzenyri-android-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: inzenyri-android-debug
          path: ${{ runner.temp }}/inzenyri-android-debug.apk
          if-no-files-found: error

  release-build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inzenyri-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/inzenyri-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: app
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle assembleRelease -PappVersionName="$version" -PappVersionCode="$GITHUB_RUN_NUMBER" -PgithubAppClientId="$GH_APP_CLIENT_ID"
          apk_path="$(find . -type f -path '*/outputs/apk/release/*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "::error::Gradle completed, but no release APK was found. APK files under the project:"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          cp "$apk_path" "$RUNNER_TEMP/inzenyri-android.apk"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: inzenyri-android-release
          path: ${{ runner.temp }}/inzenyri-android.apk
          if-no-files-found: error

  publish-release-asset:
    if: github.event_name == 'release'
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: inzenyri-android-release
          path: ${{ runner.temp }}/release
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/inzenyri-android.apk" --clobber
