# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    outputs:
      skip_page: ${{ steps.prefix.outputs.skip_page }}
      skip_ci: ${{ steps.prefix.outputs.skip_ci }}
    steps:
      - name: Checkout commit
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read build skip prefix
        id: prefix
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="$(git log -1 --format=%s 2>/dev/null || true)"
          fi
          case "${COMMIT_MESSAGE,,}" in
            '[ci skip]'*) echo "skip_page=true" >> "$GITHUB_OUTPUT"; echo "skip_ci=true" >> "$GITHUB_OUTPUT" ;;
            '[page skip]'*) echo "skip_page=true" >> "$GITHUB_OUTPUT"; echo "skip_ci=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip_page=false" >> "$GITHUB_OUTPUT"; echo "skip_ci=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Single deploy job since we're just deploying
  deploy:
    needs: commit-policy
    if:
      ${{ needs.commit-policy.outputs.skip_page != 'true' &&
      needs.commit-policy.outputs.skip_ci != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check web JavaScript syntax
        run: |
          for source in web/js/*.js web/sw.js; do
            node --check "$source"
          done
      - name: Check public asset paths
        run: |
          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          web = Path("web")
          html = (web / "index.html").read_text(encoding="utf-8")
          paths = []
          for reference in re.findall(r'(?:src|href)="([^"]+)"', html):
              url = urlsplit(reference)
              if not url.scheme and not url.netloc and url.path:
                  paths.append(url.path)
          worker = (web / "sw.js").read_text(encoding="utf-8")
          assets = re.search(r"const assetPaths = \[(.*?)\];", worker, re.S)
          if assets is None:
              raise SystemExit("Service worker asset list is missing")
          paths.extend(re.findall(r'"([^"]+)"', assets[1]))
          for path in paths:
              target = (web / path).resolve()
              if not target.is_relative_to(web.resolve()) or not target.exists():
                  raise SystemExit(f"Missing or invalid public asset: {path}")
          if not Path("data.enc.json").is_file():
              raise SystemExit("Encrypted database is missing")
          PYTHON
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir -p "$RUNNER_TEMP/inzenyri-pages"
          cp -R web/. "$RUNNER_TEMP/inzenyri-pages/"
          cp data.enc.json "$RUNNER_TEMP/inzenyri-pages/data.enc.json"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/inzenyri-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
